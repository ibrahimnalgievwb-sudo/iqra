<!-- Z-1: тема ДО применения CSS, чтобы избежать мигания -->
<script>
(function(){
  try {
    var theme = 'auto';
    var raw = localStorage.getItem('iqra_data');
    if (raw) {
      try {
        var d = JSON.parse(raw);
        if (d && d.settings && d.settings.theme) theme = d.settings.theme;
      } catch(e) {}
    }
    if (theme === 'night') theme = 'dark';
    if (theme === 'auto') {
      theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  } catch(e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>

<!-- Страховочный error-handler: должен работать до загрузки app.js -->
<script>
window.addEventListener('error', function(e) {
  var splash = document.getElementById('splash-screen');
  if (splash) splash.style.display = 'none';
  var errDiv = document.createElement('div');
  errDiv.style.cssText = 'position:fixed;inset:0;background:#000;color:var(--gold-standard);z-index:999999;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-family:sans-serif;padding:20px;';
  errDiv.innerHTML = '<h2 style="margin-bottom:10px;">Ошибка загрузки</h2><p style="font-size:14px;color:#fff;">Обновите приложение (сбросьте кэш).</p><p style="font-size:12px;margin-top:20px;opacity:.5;">' + (e.message || 'Syntax Error') + '</p>';
  if (document.body) { document.body.appendChild(errDiv); } else { document.documentElement.appendChild(errDiv); }
});
</script>
